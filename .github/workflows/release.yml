name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: attach the HACS archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fail if the manifest version does not match the tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/alarm_clocks/manifest.json'))['version'])")
          if [ "$tag" != "v$manifest" ]; then
            echo "tag $tag does not match manifest version $manifest"
            exit 1
          fi

      - name: Build alarm_clocks.zip
        run: |
          cd custom_components/alarm_clocks
          zip -r "$GITHUB_WORKSPACE/alarm_clocks.zip" . \
            -x "__pycache__/*" "*/__pycache__/*" "*.pyc" ".DS_Store" "*/.DS_Store"
          unzip -l "$GITHUB_WORKSPACE/alarm_clocks.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            alarm_clocks.zip --clobber

      # Notes given when the release was created are a summary written for
      # the release page, one entry per line, and stay. The changelog is
      # hard-wrapped, and the release page breaks at every newline, so its
      # text only stands in for notes nobody wrote.
      - name: Take the date from the changelog, and the notes unless given
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          GIVEN_NOTES: ${{ github.event.release.body }}
        run: |
          if ! python3 scripts/release_notes.py "$TAG" > notes.md; then
            echo "No changelog section for $TAG, leaving the release as it is"
            exit 0
          fi
          args=()
          if [ -z "$GIVEN_NOTES" ]; then
            args+=(--notes-file notes.md)
          else
            echo "Keeping the release notes given on creation"
          fi
          if date=$(python3 scripts/release_notes.py --date "$TAG"); then
            args+=(--title "$date")
          fi
          if [ ${#args[@]} -gt 0 ]; then
            gh release edit "$TAG" "${args[@]}"
          fi
