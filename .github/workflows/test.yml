name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    name: integration (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Install the frontend package matching Home Assistant
        run: |
          python -c "import json, pathlib, homeassistant; m = pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json'; print(json.loads(m.read_text())['requirements'][0])" > frontend-requirement.txt
          cat frontend-requirement.txt
          pip install -r frontend-requirement.txt
      - run: pytest

  card:
    name: card (build and smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Fail if the shipped card bundle is out of date
        run: |
          diff dist/alarm-clocks-card.js \
            ../custom_components/alarm_clocks/frontend/alarm-clocks-card.js
