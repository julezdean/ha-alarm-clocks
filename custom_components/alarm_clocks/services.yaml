snooze:
  target:
    device:
      integration: alarm_clocks
    entity:
      integration: alarm_clocks
  fields:
    duration:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min
          mode: box

dismiss:
  target:
    device:
      integration: alarm_clocks
    entity:
      integration: alarm_clocks

trigger_alarm:
  target:
    device:
      integration: alarm_clocks
    entity:
      integration: alarm_clocks

set_alarm:
  target:
    device:
      integration: alarm_clocks
    entity:
      integration: alarm_clocks
  fields:
    time:
      required: false
      example: "07:15:00"
      selector:
        time:
    days:
      required: false
      selector:
        select:
          multiple: true
          mode: list
          options:
            - value: mon
              label: Monday
            - value: tue
              label: Tuesday
            - value: wed
              label: Wednesday
            - value: thu
              label: Thursday
            - value: fri
              label: Friday
            - value: sat
              label: Saturday
            - value: sun
              label: Sunday
